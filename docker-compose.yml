version: "3.9"

# ---------------------------------------------------------------------------
# Full local stack for the e-commerce microservices platform.
# Bring everything up with:  docker compose up -d --build
# Tear down with:            docker compose down -v
# ---------------------------------------------------------------------------

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [ecommerce-net]

networks:
  ecommerce-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kafka-data:

services:

  # ------------------------- Infrastructure -------------------------------

  postgres:
    <<: *service-defaults
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    <<: *service-defaults
    image: apache/kafka:3.7.0
    container_name: ecommerce-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  # ------------------------- Core domain services --------------------------

  customer-service:
    <<: *service-defaults
    build: ./customer-service
    container_name: customer-service
    ports: ["8081:8081"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/customer_db
      SPRING_DATASOURCE_USERNAME: ecommerce
      SPRING_DATASOURCE_PASSWORD: ecommerce
      JWT_SECRET: ${JWT_SECRET:-this-is-a-local-dev-secret-key-please-change-in-prod-2024}
    depends_on:
      postgres: { condition: service_healthy }

  product-service:
    <<: *service-defaults
    build: ./product-service
    container_name: product-service
    ports: ["8082:8082"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product_db
      SPRING_DATASOURCE_USERNAME: ecommerce
      SPRING_DATASOURCE_PASSWORD: ecommerce
    depends_on:
      postgres: { condition: service_healthy }

  inventory-service:
    <<: *service-defaults
    build: ./inventory-service
    container_name: inventory-service
    ports: ["8084:8084"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: ecommerce
      SPRING_DATASOURCE_PASSWORD: ecommerce
    depends_on:
      postgres: { condition: service_healthy }

  cart-service:
    <<: *service-defaults
    build: ./cart-service
    container_name: cart-service
    ports: ["8083:8083"]
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      redis: { condition: service_healthy }

  payment-service:
    <<: *service-defaults
    build: ./payment-service
    container_name: payment-service
    ports: ["8086:8086"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: ecommerce
      SPRING_DATASOURCE_PASSWORD: ecommerce
    depends_on:
      postgres: { condition: service_healthy }

  order-service:
    <<: *service-defaults
    build: ./order-service
    container_name: order-service
    ports: ["8085:8085"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      SPRING_DATASOURCE_USERNAME: ecommerce
      SPRING_DATASOURCE_PASSWORD: ecommerce
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PRODUCT_SERVICE_URL: http://product-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8086
      CART_SERVICE_URL: http://cart-service:8083
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      product-service: { condition: service_started }
      inventory-service: { condition: service_started }
      payment-service: { condition: service_started }
      cart-service: { condition: service_started }

  # ------------------------- Event-driven consumers -------------------------

  notification-service:
    <<: *service-defaults
    build: ./notification-service
    container_name: notification-service
    ports: ["8087:8087"]
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka: { condition: service_healthy }

  shipping-service:
    <<: *service-defaults
    build: ./shipping-service
    container_name: shipping-service
    ports: ["8088:8088"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shipping_db
      SPRING_DATASOURCE_USERNAME: ecommerce
      SPRING_DATASOURCE_PASSWORD: ecommerce
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  analytics-service:
    <<: *service-defaults
    build: ./analytics-service
    container_name: analytics-service
    ports: ["8089:8089"]
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka: { condition: service_healthy }

  # ------------------------------- Edge -------------------------------------

  api-gateway:
    <<: *service-defaults
    build: ./api-gateway
    container_name: api-gateway
    ports: ["8080:8080"]
    environment:
      JWT_SECRET: ${JWT_SECRET:-this-is-a-local-dev-secret-key-please-change-in-prod-2024}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      CART_SERVICE_URL: http://cart-service:8083
      INVENTORY_SERVICE_URL: http://inventory-service:8084
      ORDER_SERVICE_URL: http://order-service:8085
      PAYMENT_SERVICE_URL: http://payment-service:8086
      SHIPPING_SERVICE_URL: http://shipping-service:8088
      ANALYTICS_SERVICE_URL: http://analytics-service:8089
    depends_on:
      redis: { condition: service_healthy }
      customer-service: { condition: service_started }
      product-service: { condition: service_started }
      cart-service: { condition: service_started }
      order-service: { condition: service_started }

  web-app:
    <<: *service-defaults
    build: ./web-app
    container_name: web-app
    ports: ["8090:80"]
    depends_on:
      api-gateway: { condition: service_started }
